    <style id="critical-shell-css">
      *,::before,::after{box-sizing:border-box}

      #main-header .container>div{display:flex;height:4rem;align-items:center;justify-content:space-between;gap:.5rem}
      @media (min-width:1024px){#main-header .container>div{height:5rem}}
      #logo-home-nav img{height:2.25rem;width:auto;object-fit:contain;display:block}
      @media (min-width:640px){#logo-home-nav img{height:3rem}}
      @media (min-width:768px){#logo-home-nav img{height:3.5rem}}
      .hero-shell-heading{font-family:"Outfit",system-ui,sans-serif;font-weight:800;line-height:1.15;color:#0F172A}
    </style>

    <!-- Facebook JavaScript SDK (Deferred until after initial page load & idle to protect LCP/TBT) -->
    <script>
      window.fbAsyncInit = function() {
        try {
          var fbAppId = '{your-app-id}';
          var initConfig = {
            cookie     : true,
            xfbml      : true,
            version    : 'v21.0'
          };

          // Attach appId when user configures their actual Meta App ID
          if (fbAppId && fbAppId !== '{your-app-id}' && !fbAppId.startsWith('{')) {
            initConfig.appId = fbAppId;
          }

          FB.init(initConfig);

          if (FB.AppEvents && typeof FB.AppEvents.logPageView === 'function') {
            FB.AppEvents.logPageView();
          }
        } catch (e) {
          console.warn('[Facebook SDK Init Notice]:', e);
        }
      };

      (function(w, d) {
        var loaded = false;
        function loadFbSdk() {
          if (loaded || d.getElementById('facebook-jssdk')) return;
          loaded = true;
          var js = d.createElement('script');
          js.id = 'facebook-jssdk';
          js.async = true;
          js.defer = true;
          js.src = 'https://connect.facebook.net/en_US/sdk.js';
          var fjs = d.getElementsByTagName('script')[0];
          if (fjs && fjs.parentNode) {
            fjs.parentNode.insertBefore(js, fjs);
          } else if (d.head) {
            d.head.appendChild(js);
          }
        }
        var triggerEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function onFirstInteraction() {
          triggerEvents.forEach(function(evt) {
            w.removeEventListener(evt, onFirstInteraction);
          });
          loadFbSdk();
        }
        triggerEvents.forEach(function(evt) {
          w.addEventListener(evt, onFirstInteraction, { once: true, passive: true });
        });
        w.addEventListener('load', function() {
          w.setTimeout(loadFbSdk, 10000);
        }, { once: true });
      })(window, document);
    </script>
