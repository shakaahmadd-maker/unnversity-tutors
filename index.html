    <style id="critical-shell-css">

    <!-- Facebook JavaScript SDK (Strictly deferred until after window.load + idle or explicit user tap/keypress) -->
    <script>
      window.fbAsyncInit = function() {
        try {
          var fbAppId = '{your-app-id}';
          var initConfig = {
            cookie     : true,
            xfbml      : true,
            version    : 'v21.0'

            initConfig.appId = fbAppId;
          }
          FB.init(initConfig);
          if (FB.AppEvents && typeof FB.AppEvents.logPageView === 'function') {
            FB.AppEvents.logPageView();
          }
        } catch (e) {
          console.warn('[Facebook SDK Init Notice]:', e);
        }
      };

      (function(w, d) {
        var loaded = false;
        function loadFbSdk() {
          if (loaded || d.getElementById('facebook-jssdk')) return;
          loaded = true;
          var js = d.createElement('script');
          js.id = 'facebook-jssdk';
          js.async = true;
          js.defer = true;
          js.src = 'https://connect.facebook.net/en_US/sdk.js';
          (d.body || d.head).appendChild(js);
        }
        var triggerEvents = ['pointerdown', 'keydown', 'touchstart'];
        function onFirstInteraction() {
          triggerEvents.forEach(function(evt) {
            w.removeEventListener(evt, onFirstInteraction);
          });
          loadFbSdk();
        }
        triggerEvents.forEach(function(evt) {
          w.addEventListener(evt, onFirstInteraction, { once: true, passive: true });
        });
        w.addEventListener('load', function() {
          w.setTimeout(function() {
            if (typeof w.requestIdleCallback === 'function') {
              w.requestIdleCallback(loadFbSdk, { timeout: 5000 });
            } else {
              loadFbSdk();
            }
          }, 12000);
        }, { once: true });
      })(window, document);
    </script>
